name: Cyber Park - Windows Setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Tekshiruv_API_tayyor/**'
      - 'CyberPark_GitHub_Windows_Setup_Tayyor (1).zip'
      - '.github/workflows/build-windows.yml'
      - '.github/patches/**'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: Tekshiruv_API_tayyor
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unpack uploaded source ZIP into project folder
        shell: pwsh
        working-directory: .
        run: |
          $archive = 'CyberPark_GitHub_Windows_Setup_Tayyor (1).zip'
          if (!(Test-Path -LiteralPath $archive)) { throw "Source ZIP missing: $archive" }
          Expand-Archive -LiteralPath $archive -DestinationPath . -Force
          if (!(Test-Path 'Tekshiruv_API_tayyor/requirements.txt')) { throw 'Project source missing after extraction' }
          if (!(Test-Path 'Tekshiruv_API_tayyor/scripts/windows_verify.ps1')) { throw 'Windows verification script missing' }

      - name: Make smoke tests noninteractive and time-bounded
        shell: pwsh
        run: |
          $launcher = 'desktop_webview.py'
          $src = Get-Content -LiteralPath $launcher -Raw
          $old = "        alert('Dastur oynasi ishga tushmadi. Jurnal: ' + str(log_path()))"
          $new = "        if '--smoke-test' not in sys.argv:`n            alert('Dastur oynasi ishga tushmadi. Jurnal: ' + str(log_path()))"
          if (!$src.Contains($old)) { throw 'Launcher smoke-test alert pattern missing' }
          $src = $src.Replace($old,$new)
          if (!$src.Contains("log_level='warning', access_log=False")) { throw 'Uvicorn config pattern not found' }
          $src = $src.Replace("log_level='warning', access_log=False", "log_config=None, log_level='warning', access_log=False")
          Set-Content -LiteralPath $launcher -Value $src -Encoding UTF8
          $verify = 'scripts/windows_verify.ps1'
          $v = Get-Content -LiteralPath $verify -Raw
          if (($v.Split(' -Wait -PassThru').Count - 1) -ne 3) { throw 'Unexpected number of blocking process waits' }
          $v = $v.Replace(' -Wait -PassThru',' -PassThru')
          $timeout = 'if (!$p.WaitForExit(180000)) { $p.Kill(); throw "Process timed out after 180 seconds" }' + "`n"
          $v = $v.Replace('if ($p.ExitCode -ne 0)', $timeout + 'if ($p.ExitCode -ne 0)')
          Set-Content -LiteralPath $verify -Value $v -Encoding UTF8

      - name: Fix report export inside native Windows window
        shell: pwsh
        working-directory: .
        run: python .github/patches/report_fix.py

      - name: Install Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: Tekshiruv_API_tayyor/requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pyinstaller>=6.11,<7' pytest

      - name: Python tests
        shell: pwsh
        run: python -m pytest tests -q

      - name: Frontend JavaScript syntax
        shell: pwsh
        run: node --check static/app.js

      - name: Build Windows EXE (onedir)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CyberPark_Tekshiruv --icon assets/rabbit_icon.ico --add-data 'static;static' --add-data 'assets;assets' --collect-all webview --collect-all docx --collect-all pymupdf --collect-all fitz --hidden-import=app --hidden-import=xlrd --hidden-import=striprtf --hidden-import=PIL --hidden-import=cryptography --hidden-import=inspector.ccvibe_probe --hidden-import=uvicorn.protocols.http.h11_impl --hidden-import=uvicorn.lifespan.on --hidden-import=uvicorn.loops.asyncio desktop_webview.py
          if (!(Test-Path dist/CyberPark_Tekshiruv/CyberPark_Tekshiruv.exe)) { throw 'EXE was not produced' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows Setup.exe
        shell: pwsh
        run: |
          $locations = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $locations | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { throw 'Inno Setup compiler not installed' }
          & $iscc 'CyberPark_Tekshiruv.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }

      - name: Windows bundled and installed smoke tests + SHA256
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/windows_verify.ps1

      - name: Upload Setup and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CyberPark-Windows-Setup
          path: |
            Tekshiruv_API_tayyor/installer/CyberPark_Tekshiruv_Setup.exe
            Tekshiruv_API_tayyor/installer/SHA256.txt
          if-no-files-found: error
          retention-days: 14
